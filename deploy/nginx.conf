server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  absolute_redirect off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'none'; manifest-src 'self'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-site" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;

  location = /security-policy {
    return 301 /security;
  }

  location = /evidence-health {
    return 301 /evidence;
  }

  location = /_redirects {
    return 404;
  }

  location ~ /\.(?!well-known) {
    return 404;
  }

  location /assets/ {
    expires 1h;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }
}
