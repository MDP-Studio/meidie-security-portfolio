name: Verify Portfolio Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Test evidence freshness checker
        run: node --test tests/evidence_freshness.test.js

      - name: Check live public evidence
        run: |
          rm -f reports/evidence-freshness.md reports/evidence-freshness.json
          node tools/check_evidence_freshness.js --fail-on-unwaived-warning
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Sync deploy directory
        run: bash tools/sync_public.sh

      - name: Verify static page assets and deploy copy
        run: node tools/check_page.js

      - name: Add evidence report to job summary
        if: always()
        run: |
          if [ -f reports/evidence-freshness.md ]; then
            cat reports/evidence-freshness.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: evidence-freshness-${{ github.sha }}
          path: reports/evidence-freshness.*
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified static bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-public-${{ github.sha }}
          path: public/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
